name: Build Alfred workflow release

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Test and build
        run: |
          make test
          make build
          python3 -m compileall -q src scripts tools

      - name: Attach workflow and publish tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          asset='dist/Alfred-SSH-Manager.alfredworkflow'
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq 'Alfred-SSH-Manager.alfredworkflow'; then
              echo 'Workflow asset is already attached.'
            else
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          elif [ "$EVENT_NAME" = 'push' ]; then
            gh release create "$RELEASE_TAG" "$asset" --verify-tag --generate-notes
          else
            echo "Release $RELEASE_TAG is unavailable." >&2
            exit 1
          fi
